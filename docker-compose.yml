services:
  signaling:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-signaling
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - TURN_SECRET=${TURN_SECRET:-nexus-dev-secret}
      - TURN_HOST=${TURN_HOST:-127.0.0.1}
      - TURN_PORT=${TURN_PORT:-3478}
      - TURN_TTL=${TURN_TTL:-86400}
      - RUST_LOG=${RUST_LOG:-info}
    depends_on:
      - turn

  turn:
    image: coturn/coturn:latest
    container_name: nexus-turn
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49152-49200:49152-49200/udp"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - "-c"
      - "/etc/coturn/turnserver.conf"
      - "--static-auth-secret=${TURN_SECRET:-nexus-dev-secret}"
      - "--realm=nexus-remote"
