# coturn configuration for Nexus Remote Relay Server

# Network / Ports
listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=49200

# Authentication & Mechanism
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=nexus-dev-secret
realm=nexus-remote

# Security & Isolation
no-loopback-peers
no-multicast-peers
stale-nonce=600

# Quota & Limits
total-quota=100
bps-capacity=0

# Logging
log-file=stdout
no-stdout-log=0
simple-log
